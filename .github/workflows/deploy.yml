name: Build and deploy

# Builds the plugin, drops it into a pinned GeoLibre checkout as a bundled
# plugin, builds the GeoLibre web app, and publishes the result to GitHub Pages.
#
# No secrets are involved. The plugin reads open imagery from public endpoints
# that answer anonymous requests, so there is no client ID to inject and no
# credential that could leak into the published bundle.
#
# GeoLibre is never vendored into this repository. It is checked out here at a
# pinned tag so a deploy is reproducible and an upstream change cannot alter
# what colleagues see without a deliberate bump to GEOLIBRE_REF.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GEOLIBRE_REF: v1.9.0
  PLUGIN_ID: tuvsud-disturbance-check

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the plugin
        working-directory: plugin
        run: |
          npm ci
          npm run build
          npm test

      - name: Check out GeoLibre
        uses: actions/checkout@v4
        with:
          repository: opengeos/GeoLibre
          ref: ${{ env.GEOLIBRE_REF }}
          path: geolibre

      - name: Drop the plugin into the GeoLibre build
        run: |
          target="geolibre/apps/geolibre-desktop/public/plugins/${PLUGIN_ID}"
          mkdir -p "$target/dist"
          cp plugin/plugin.json "$target/plugin.json"
          cp plugin/dist/index.js "$target/dist/index.js"
          cp plugin/dist/style.css "$target/dist/style.css"
          ls -la "$target" "$target/dist"

      - name: Build the GeoLibre web app
        working-directory: geolibre
        env:
          # GitHub Pages serves this project from a subpath, so the app must be
          # built with a matching base or every asset URL 404s.
          GEOLIBRE_APP_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - name: Fail if the plugin did not make it into the build output
        run: |
          out="geolibre/apps/geolibre-desktop/dist/plugins/${PLUGIN_ID}/dist/index.js"
          if [ ! -f "$out" ]; then
            echo "The plugin bundle is missing from the build output at $out"
            exit 1
          fi
          echo "Plugin present: $(du -h "$out" | cut -f1)"

      # GeoLibre decides its theme from ?theme= first and the operating system
      # preference second, and persists nothing. Verifiers read classified
      # rasters and true-colour composites against the map all day, so the
      # deployment defaults to dark rather than inheriting whatever each
      # colleague's laptop happens to be set to. An explicit ?theme=light still
      # wins, and the in-app toggle is untouched.
      #
      # The snippet is a classic inline script in the head, so it runs during
      # parsing and lands before the deferred module bundle reads the query
      # string.
      - name: Default the deployed app to dark mode
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path

          page = Path("geolibre/apps/geolibre-desktop/dist/index.html")
          html = page.read_text()
          snippet = (
              "<script>(function(){"
              "var u=new URL(window.location.href);"
              "if(!u.searchParams.has('theme')){"
              "u.searchParams.set('theme','dark');"
              "window.history.replaceState(null,'',u);"
              "document.documentElement.classList.add('dark');"
              "document.documentElement.style.colorScheme='dark';"
              "}})();</script>"
          )
          if "searchParams.set('theme','dark')" in html:
              raise SystemExit("the dark-mode snippet is already present")
          if "<head>" not in html:
              raise SystemExit("no <head> in the built index.html")
          page.write_text(html.replace("<head>", "<head>" + snippet, 1))
          print("dark mode default injected")
          PYTHON

      - name: Disable Jekyll processing
        run: touch geolibre/apps/geolibre-desktop/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: geolibre/apps/geolibre-desktop/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
