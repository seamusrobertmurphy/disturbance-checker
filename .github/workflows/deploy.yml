name: Build and deploy

# Builds the plugin, drops it into a pinned GeoLibre checkout as a bundled
# plugin, builds the GeoLibre web app, and publishes the result to GitHub Pages.
#
# No secrets are involved. The plugin reads open imagery from public endpoints
# that answer anonymous requests, so there is no client ID to inject and no
# credential that could leak into the published bundle.
#
# GeoLibre is never vendored into this repository. It is checked out here at a
# pinned tag so a deploy is reproducible and an upstream change cannot alter
# what colleagues see without a deliberate bump to GEOLIBRE_REF.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GEOLIBRE_REF: v1.9.0
  PLUGIN_ID: tuvsud-disturbance-check

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the plugin
        working-directory: plugin
        run: |
          npm ci
          npm run build
          npm test

      - name: Check out GeoLibre
        uses: actions/checkout@v4
        with:
          repository: opengeos/GeoLibre
          ref: ${{ env.GEOLIBRE_REF }}
          path: geolibre

      - name: Drop the plugin into the GeoLibre build
        run: |
          target="geolibre/apps/geolibre-desktop/public/plugins/${PLUGIN_ID}"
          mkdir -p "$target/dist"
          cp plugin/plugin.json "$target/plugin.json"
          cp plugin/dist/index.js "$target/dist/index.js"
          cp plugin/dist/style.css "$target/dist/style.css"
          ls -la "$target" "$target/dist"

      # The cloud model and the runtime that executes it.
      #
      # Kept out of the plugin bundle and fetched at runtime from this
      # directory, because the plugin is built as one inlined ES module: a
      # bundled runtime would land in every load of the app whether or not
      # anyone selects that mask. Only a run that asks for it pays.
      #
      # The weights are committed, so what a tagged deploy runs cannot change
      # under it. The wasm is not: it comes from the onnxruntime-web pinned in
      # package-lock.json, so it never enters this repository's history.
      - name: Ship the models and the runtime
        run: |
          target="geolibre/apps/geolibre-desktop/public/plugins/${PLUGIN_ID}/vendor"
          runtime="plugin/node_modules/onnxruntime-web/dist"
          mkdir -p "$target"
          cp plugin/vendor/ocm-v4-regnety.onnx "$target/"
          cp plugin/vendor/ocm-v4-edgenext.onnx "$target/"
          cp plugin/vendor/cloud-model.json "$target/"
          # The super-resolution backdrop. 236 KB beside 60 MB of cloud model,
          # and fetched only when an operator asks to sharpen a view.
          cp plugin/vendor/sen2srlite-rgbn-x4.onnx "$target/"
          cp plugin/vendor/sen2sr-model.json "$target/"
          cp "$runtime/ort.webgpu.min.mjs" "$target/"

          # Which wasm goes with it is read out of the runtime rather than
          # named here. onnxruntime-web renames these between versions, and a
          # hand-written list that has gone stale fails only in a browser, as
          # "no available backend found", which is the most expensive place to
          # find it. v0.11.0 shipped the jsep pair when 1.27 wanted asyncify.
          needed=$(grep -o 'ort-wasm[a-z0-9.-]*\.mjs' "$runtime/ort.webgpu.min.mjs" | sort -u)
          if [ -z "$needed" ]; then
            echo "Could not read any wasm loader name out of ort.webgpu.min.mjs"
            exit 1
          fi
          for loader in $needed; do
            binary="${loader%.mjs}.wasm"
            if [ ! -f "$runtime/$loader" ] || [ ! -f "$runtime/$binary" ]; then
              echo "onnxruntime-web references $loader but $runtime does not carry it and its .wasm"
              exit 1
            fi
            cp "$runtime/$loader" "$runtime/$binary" "$target/"
            echo "runtime: $loader with $binary"
          done
          du -h "$target"/* | sort -h

      # GeoLibre's Notebook panel loads a JupyterLite site, a full Jupyter
      # that runs Python in the browser with no server. GeoLibre's prebuild
      # hook makes it with the `jupyter lite` command, but skips quietly and
      # exits 0 when that command is missing, so the panel 404s on the
      # published site. The pins come from the pinned GeoLibre checkout, and
      # the check after the build fails the deploy if the site is absent.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the JupyterLite build tools
        run: python -m pip install -r geolibre/apps/geolibre-desktop/jupyterlite/requirements.txt

      - name: Build the GeoLibre web app
        working-directory: geolibre
        env:
          # GitHub Pages serves this project from a subpath, so the app must be
          # built with a matching base or every asset URL 404s.
          GEOLIBRE_APP_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          # MapLibre's image queue drainer reads abortController off entries it
          # has already cleared, so every basemap tile queued above the
          # sixteen-request cap rejects once with a TypeError and lands in the
          # diagnostics panel. The defect is upstream and version-pinned here,
          # so it is repaired at its source before the bundle is built, leaving
          # the plugin bytes untouched. The script fails the build if the
          # pinned MapLibre ever changes shape.
          node ../plugin/scripts/patch-maplibre-image-queue.mjs
          # GeoLibre prints the project path at the right end of its toolbar,
          # which on a Pages deploy is this deploy's own URL, so every
          # screenshot carried an account name and a repository address across
          # the top. The span is removed outright. Fails the build if the
          # pinned GeoLibre ever moves that markup.
          node ../plugin/scripts/patch-toolbar-project-path.mjs
          # The GeoLibre logo at the left end of the toolbar is removed the same
          # way, icon and word both. Fails the build if the pinned GeoLibre ever
          # moves that markup.
          node ../plugin/scripts/patch-toolbar-logo.mjs
          # GeoAgent's "use latest model" button names Claude Opus 4.8. This
          # moves it to Opus 5 and lets Opus 5's thinking blocks survive a tool
          # call. Fails the build if the pinned maplibre-gl-geoagent changes.
          node ../plugin/scripts/patch-geoagent-models.mjs
          # GeoLibre's Layers panel shows almost nothing about a layer. This
          # adds a hover card and a right-click menu listing its folder, kind,
          # source, copy date, feature count, zoom range and address. Fails
          # the build if the pinned GeoLibre ever moves that markup.
          node ../plugin/scripts/patch-layer-info.mjs
          npm run build

      - name: Fail if the plugin did not make it into the build output
        run: |
          out="geolibre/apps/geolibre-desktop/dist/plugins/${PLUGIN_ID}/dist/index.js"
          if [ ! -f "$out" ]; then
            echo "The plugin bundle is missing from the build output at $out"
            exit 1
          fi
          echo "Plugin present: $(du -h "$out" | cut -f1)"
          vendor="geolibre/apps/geolibre-desktop/dist/plugins/${PLUGIN_ID}/vendor"
          for file in ocm-v4-regnety.onnx ocm-v4-edgenext.onnx ort.webgpu.min.mjs; do
            if [ ! -s "$vendor/$file" ]; then
              echo "The cloud mask would 404 at runtime: $vendor/$file is missing or empty"
              exit 1
            fi
          done
          if [ ! -s "$vendor/sen2srlite-rgbn-x4.onnx" ]; then
            echo "Sharpening would 404 at runtime: $vendor/sen2srlite-rgbn-x4.onnx is missing or empty"
            exit 1
          fi
          # Every loader the runtime can reach for must be beside it, with its
          # binary. This is the check that would have caught v0.11.0.
          for loader in $(grep -o 'ort-wasm[a-z0-9.-]*\.mjs' "$vendor/ort.webgpu.min.mjs" | sort -u); do
            if [ ! -s "$vendor/$loader" ] || [ ! -s "${vendor}/${loader%.mjs}.wasm" ]; then
              echo "The runtime asks for $loader but it or its .wasm is not published beside it"
              exit 1
            fi
            echo "runtime present: $loader"
          done
          echo "Cloud model present: $(du -sh "$vendor" | cut -f1)"
          lite="geolibre/apps/geolibre-desktop/dist/jupyterlite/lab/index.html"
          if [ ! -f "$lite" ]; then
            echo "The Notebook panel would 404: $lite is missing"
            exit 1
          fi
          echo "Notebook present: $(du -sh geolibre/apps/geolibre-desktop/dist/jupyterlite | cut -f1)"

      # Two things every colleague should get without touching a control.
      #
      # Theme: GeoLibre reads ?theme= first and the operating system preference
      # second, and persists nothing. The deployment defaults to light rather
      # than inheriting whatever each laptop is set to.
      #
      # Activation: a plugin dropped into public/plugins is always *loaded*,
      # but loading is not activating, and v1.9.0 refuses activeByDefault on
      # external plugins outright ("External plugins cannot use
      # activeByDefault"). Until now that left every visitor to find the
      # Plugins menu themselves, and a colleague who cleared their site data
      # silently lost the panel with no way of knowing why.
      #
      # A project file is the supported route: GeoLibre loads one from ?project=
      # and honours its plugins.activePluginIds. So the deploy ships a minimal
      # startup project that switches this plugin on, and the snippet points at
      # it when the visitor asked for no other project.
      #
      # Both are defaults, not impositions. An explicit ?theme=dark or
      # ?project=... still wins, and the in-app controls are untouched.
      # Fire records, national park boundaries and PAD-US come from ArcGIS
      # feature services that cannot draw a map, so they are snapshotted into
      # PMTiles by plugin/scripts/fire_snapshots.py and published beside the
      # app. A snapshot is reused for the rest of its ISO week, so only the
      # first deploy of a week pays the download. When the services do not
      # answer, the cached snapshot is published with a warning and keeps its
      # own date in the Layers panel.
      #
      # GRIP4 North America roads come from a single 525 MB file geodatabase
      # published in 2023 for a 2018 dataset, so they are built once and kept
      # under a fixed cache key. Only highways, primary, secondary and tertiary
      # roads (GP_RTP 1 to 4) are tiled, to zoom 10, which keeps the file
      # within what GitHub Pages will serve.
      #
      # Registered carbon project boundaries come from Karnik et al. (2024), a
      # 1.7 GB set of GeoPackages on Zenodo that has not changed since June
      # 2024, so they are tiled once per version of carbon_projects.py and
      # kept. If Zenodo does not answer, the site deploys without that folder.
      - name: Week of the snapshot
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the feature service snapshot
        id: fires
        uses: actions/cache@v4
        with:
          path: fire-snapshot
          key: fire-snapshot-${{ steps.week.outputs.week }}-${{ hashFiles('plugin/scripts/fire_snapshots.py') }}
          restore-keys: fire-snapshot-

      - name: Restore the GRIP4 roads
        id: roads
        uses: actions/cache@v4
        with:
          path: roads-snapshot
          key: grip4-region1-main-roads-z10-v1

      - name: Restore the carbon project boundaries
        id: carbon
        uses: actions/cache@v4
        with:
          path: carbon-snapshot
          key: carbon-projects-zenodo-11459391-${{ hashFiles('plugin/scripts/carbon_projects.py') }}

      - name: Build tippecanoe
        if: steps.fires.outputs.cache-hit != 'true' || steps.roads.outputs.cache-hit != 'true' || steps.carbon.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends libsqlite3-dev zlib1g-dev gdal-bin
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git tippecanoe-src
          make -C tippecanoe-src -j"$(nproc)" tippecanoe

      - name: Build the feature service snapshot
        if: steps.fires.outputs.cache-hit != 'true'
        run: |
          rm -rf fire-snapshot.new
          if python3 plugin/scripts/fire_snapshots.py fire-snapshot.new tippecanoe-src/tippecanoe; then
            rm -rf fire-snapshot
            mv fire-snapshot.new fire-snapshot
          elif [ -f fire-snapshot/snapshot.json ]; then
            echo "::warning::A feature service did not answer; publishing the cached snapshot instead"
          else
            echo "No snapshot could be built and none was cached"
            exit 1
          fi

      # GRIP4 North America, Global Roads Inventory Project, region 1, CC0
      # https://dataportaal.pbl.nl/downloads/GRIP4/GRIP4_Region1_vector_fgdb.zip
      # https://www.globio.info/download-grip-dataset
      # https://doi.org/10.1088/1748-9326/aabd42
      # A failed roads build leaves the site deploying without the roads layer.
      # The file is assembled in roads-build and moved into place only when
      # complete, so a partial file is never cached under the fixed key.
      - name: Build the GRIP4 roads
        if: steps.roads.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          curl -sSL --retry 3 -o grip4.zip https://dataportaal.pbl.nl/downloads/GRIP4/GRIP4_Region1_vector_fgdb.zip
          unzip -q grip4.zip -d grip4
          rm grip4.zip
          gdb=$(find grip4 -maxdepth 3 -name '*.gdb' | head -1)
          rm -rf roads-build
          mkdir -p roads-build
          ogr2ogr -f GeoJSONSeq -select GP_RTP -where "GP_RTP BETWEEN 1 AND 4" /vsistdout/ "$gdb" \
            | tippecanoe-src/tippecanoe -o roads-build/grip4-north-america-main-roads.pmtiles \
                --force -l roads -z 10 --drop-densest-as-needed --extend-zooms-if-still-dropping
          rm -rf grip4
          size=$(stat -c %s roads-build/grip4-north-america-main-roads.pmtiles)
          echo "{\"bytes\": $size, \"roads\": \"GP_RTP 1 to 4\", \"maxzoom\": 10}" > roads-build/roads.json
          rm -rf roads-snapshot
          mv roads-build roads-snapshot
          du -sh roads-snapshot

      # A global database of nature-based carbon offset project boundaries, Karnik et al. (2024), CC BY 4.0
      # https://doi.org/10.5281/zenodo.11459391
      - name: Build the carbon project boundaries
        if: steps.carbon.outputs.cache-hit != 'true'
        run: |
          rm -rf carbon-build
          if python3 plugin/scripts/carbon_projects.py carbon-build tippecanoe-src/tippecanoe; then
            rm -rf carbon-snapshot
            mv carbon-build carbon-snapshot
            du -sh carbon-snapshot
          else
            echo "::warning::The carbon project boundaries could not be built; that folder is left out"
          fi

      - name: Publish the snapshots
        run: |
          target=geolibre/apps/geolibre-desktop/dist/snapshots
          mkdir -p "$target"
          cp fire-snapshot/*.pmtiles fire-snapshot/snapshot.json "$target/"
          if [ -f roads-snapshot/roads.json ]; then
            cp roads-snapshot/*.pmtiles roads-snapshot/roads.json "$target/"
          else
            echo "::warning::No GRIP4 roads snapshot; the roads layer is left out"
          fi
          if [ -f carbon-snapshot/carbon.json ]; then
            cp carbon-snapshot/*.pmtiles carbon-snapshot/carbon.json "$target/"
          fi
          du -sh "$target" geolibre/apps/geolibre-desktop/dist

      - name: Open light, with the plugin already switched on
        env:
          # The published origin, so URLs written into the startup project are
          # absolute. A relative basemap URL would be resolved against whatever
          # the caller passed as ?project=, which is not necessarily this site.
          PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          dist = Path("geolibre/apps/geolibre-desktop/dist")
          plugin_id = "tuvsud-disturbance-check"
          site = os.environ["PAGES_ORIGIN"].rstrip("/") + os.environ["PAGES_BASE"]

          # A satellite basemap, not a road map. Every layer this tool draws is
          # evidence about vegetation, and a cartographic basemap gives a
          # verifier nothing to check it against. Imagery does: a classified
          # cell either sits on a cutblock or it does not.
          #
          # Esri World Imagery is anonymous, sends CORS, and is the same
          # archive the dated Wayback timeline in section 7 steps through, so
          # the basemap and the timeline agree on what the ground looks like.
          satellite = {
              "version": 8,
              "sources": {
                  "esri-world-imagery": {
                      "type": "raster",
                      "tiles": [
                          "https://services.arcgisonline.com/ArcGIS/rest/services"
                          "/World_Imagery/MapServer/tile/{z}/{y}/{x}"
                      ],
                      "tileSize": 256,
                      "maxzoom": 19,
                      "attribution": (
                          "Esri, Maxar, Earthstar Geographics, and the GIS User "
                          "Community"
                      ),
                  }
              },
              "layers": [
                  {
                      "id": "esri-world-imagery",
                      "type": "raster",
                      "source": "esri-world-imagery",
                  }
              ],
          }
          style = dist / "satellite-basemap.json"
          style.write_text(json.dumps(satellite, indent=2) + "\n")

          # The corroboration layers, every one switched off, in folders in the
          # Layers panel. See plugin/scripts/corroboration_layers.py for sources.
          import sys
          sys.path.insert(0, "plugin/scripts")
          from corroboration_layers import project_layers
          corroboration_layers, corroboration_groups = project_layers(
              fire_snapshot="fire-snapshot/snapshot.json",
              roads_snapshot="roads-snapshot/roads.json",
              carbon_snapshot="carbon-snapshot/carbon.json",
              site=site,
          )

          project = {
              "version": "1.0.0",
              "name": "Disturbance Check",
              "mapView": {
                  "center": [-98.5, 39.8],
                  "zoom": 3,
                  "bearing": 0,
                  "pitch": 0,
              },
              "basemapStyleUrl": f"{site}satellite-basemap.json",
              "layers": corroboration_layers,
              "layerGroups": corroboration_groups,
              "styles": {},
              "plugins": {
                  "manifestUrls": [],
                  "activePluginIds": [plugin_id],
                  "mapControlPositions": {},
                  "settings": {},
              },
          }
          startup = dist / "disturbance-check.geolibre.json"
          startup.write_text(json.dumps(project, indent=2) + "\n")

          snippet = (
              "<script>(function(){"
              "var u=new URL(window.location.href);"
              "var changed=false;"
              "if(!u.searchParams.has('theme')){"
              "u.searchParams.set('theme','light');"
              "document.documentElement.classList.remove('dark');"
              "document.documentElement.style.colorScheme='light';"
              "changed=true;}"
              "var hasProject=['url','project','projectUrl','project_url']"
              ".some(function(k){return u.searchParams.has(k);});"
              "if(!hasProject&&!/^\\?https?:/i.test(u.search)){"
              "u.searchParams.set('project',"
              "new URL('disturbance-check.geolibre.json',"
              "document.baseURI).href);"
              "changed=true;}"
              "if(changed){window.history.replaceState(null,'',u);}"
              "})();</script>"
          )

          page = dist / "index.html"
          html = page.read_text()
          if "disturbance-check.geolibre.json" in html:
              raise SystemExit("the startup snippet is already present")
          if "<head>" not in html:
              raise SystemExit("no <head> in the built index.html")
          page.write_text(html.replace("<head>", "<head>" + snippet, 1))
          print("startup project written and snippet injected")
          PYTHON

      - name: Disable Jekyll processing
        run: touch geolibre/apps/geolibre-desktop/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: geolibre/apps/geolibre-desktop/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
